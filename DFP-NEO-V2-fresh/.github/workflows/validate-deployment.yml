name: Validate Deployment Structure

on:
  push:
    branches:
      - feature/comprehensive-build-algorithm
      - main
  pull_request:
    branches:
      - feature/comprehensive-build-algorithm
      - main

jobs:
  validate-structure:
    name: Check Critical Files Are in DFP-NEO-V2-fresh/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify railway.json is in DFP-NEO-V2-fresh
        run: |
          if [ ! -f "DFP-NEO-V2-fresh/railway.json" ]; then
            echo "❌ CRITICAL: DFP-NEO-V2-fresh/railway.json missing!"
            echo "Railway deploys from DFP-NEO-V2-fresh/ subdirectory."
            exit 1
          fi
          echo "✅ railway.json found in correct location"

      - name: Verify server.js is in DFP-NEO-V2-fresh
        run: |
          if [ ! -f "DFP-NEO-V2-fresh/server.js" ]; then
            echo "❌ CRITICAL: DFP-NEO-V2-fresh/server.js missing!"
            exit 1
          fi
          echo "✅ server.js found in correct location"

      - name: Check for accidental root-level server.js
        run: |
          if [ -f "server.js" ]; then
            echo "⚠️ WARNING: server.js found at repository root!"
            echo "This file will NOT be deployed by Railway."
            echo "Railway only deploys from DFP-NEO-V2-fresh/ subdirectory."
            echo "If you intended to modify the server, edit DFP-NEO-V2-fresh/server.js instead."
            exit 1
          fi
          echo "✅ No accidental root-level server.js found"

      - name: Check for accidental root-level package.json app code
        run: |
          # Check if there's a package.json at root that isn't supposed to be there
          if [ -f "package.json" ] && [ ! -f "DFP-NEO-V2-fresh/package.json" ]; then
            echo "⚠️ WARNING: package.json at root but missing in DFP-NEO-V2-fresh/"
            echo "Railway deploys from DFP-NEO-V2-fresh/ subdirectory."
            exit 1
          fi
          echo "✅ Package structure looks correct"

      - name: Verify built files exist
        run: |
          if [ ! -d "DFP-NEO-V2-fresh/dfp-neo-platform/public/flight-school-app/assets" ]; then
            echo "⚠️ WARNING: Built assets directory not found!"
            echo "Run 'npm run build' inside DFP-NEO-V2-fresh/ before committing."
            echo "Railway serves built files, not source TypeScript."
            exit 1
          fi
          echo "✅ Built assets directory found"

      - name: Summary
        run: |
          echo ""
          echo "✅ ================================== ✅"
          echo "   Deployment structure validated!"
          echo "   Railway will deploy correctly from"
          echo "   DFP-NEO-V2-fresh/ subdirectory."
          echo "✅ ================================== ✅"