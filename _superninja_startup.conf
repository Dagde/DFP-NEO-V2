
[program:5556_node]
command=/bin/bash -c "source ~/.bashrc 2>/dev/null; exec node /workspace/DFP-NEO-V2-fresh/node_modules/.bin/prisma studio --port 5556"
directory=/workspace/DFP-NEO-V2-fresh
user=root
autostart=true
autorestart=true
startsecs=3
startretries=3
stderr_logfile=/var/log/supervisor/5556_node.err.log
stdout_logfile=/var/log/supervisor/5556_node.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2


[program:9084_github-mcp-serv]
command=/bin/bash -c "source ~/.bashrc 2>/dev/null; exec /tmp/github-mcp-server"
directory=/opt/ninja-mcp-servers/github-mcp
user=root
autostart=true
autorestart=true
startsecs=3
startretries=3
stderr_logfile=/var/log/supervisor/9084_github-mcp-serv.err.log
stdout_logfile=/var/log/supervisor/9084_github-mcp-serv.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2


[program:8888_python]
command=/bin/bash -c "source ~/.bashrc 2>/dev/null; exec python -m http.server 8888 --directory ."
directory=/workspace
user=root
autostart=true
autorestart=true
startsecs=3
startretries=3
stderr_logfile=/var/log/supervisor/8888_python.err.log
stdout_logfile=/var/log/supervisor/8888_python.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

